# .github/release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octo-bot
  categories:
    - title: '🚀 Features'
      labels:
        - 'feature'
        - 'enhancement'
    - title: '🐛 Bug Fixes'
      labels:
        - 'bug'
        - 'fix'
        - 'bugfix'
    - title: '🔐 Security'
      labels:
        - 'security'
    - title: '⚖️ Compliance'
      labels:
        - 'compliance'
        - 'legal'
    - title: '🧰 Maintenance'
      labels:
        - 'chore'
        - 'docs'
        - 'ci'
        - 'refactor'
